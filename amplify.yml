version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci --ignore-scripts
        build:
          commands:
            - npm run build
            - node scripts/verify-hosting.mjs
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
