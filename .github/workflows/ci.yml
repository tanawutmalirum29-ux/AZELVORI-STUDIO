name: Studio quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash -n scripts/open-public-beta.sh
      - run: npm run build
      - run: node scripts/verify-hosting.mjs
      - run: npm test
      - run: npm run infra:synth -- --quiet
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:workspace
      - run: npm run test:e2e:public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studio-qa-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            workspace-report/
            workspace-test-results/
            public-report/
            public-test-results/
            apps/web/dist/
            cdk.out/*.template.json
          retention-days: 14
      # No cloud deploy or AWS credentials in this workflow. main is development source.
